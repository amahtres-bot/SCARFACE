
name: Build SCARFACE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          unzip -o "SCARFACE_Android_Project-1.zip" -d extracted
          APP_GRADLE=$(find extracted -type f -path '*/app/build.gradle' -print -quit)
          if [ -z "$APP_GRADLE" ]; then
            echo "Android project not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")
          cp -a "$PROJECT_DIR"/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCARFACE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
